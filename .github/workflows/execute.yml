name: Encrypted public executor
run-name: Encrypted executor ${{ github.sha }}

on:
  push:
    branches:
      - executor/broker-dev
    paths:
      - "in/*.bin"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: executor-broker-retention
      cancel-in-progress: false
    outputs:
      runner_label: ${{ steps.plan.outputs.runner_label }}
      transport_id: ${{ steps.plan.outputs.transport_id }}
      input_path: ${{ steps.plan.outputs.input_path }}
      active_jobs: ${{ steps.plan.outputs.active_jobs }}
    steps:
      - name: Checkout trusted executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Accept encrypted repository job
        id: plan
        env:
          BROKER_BRANCH: executor/broker-dev
          BROKER_BASELINE_BRANCH: repo-broker-dev
          GITHUB_TOKEN: ${{ github.token }}
          AGENTIC_INPUT_UNWRAP_PRIVATE_KEY_PEM: ${{ secrets.AGENTIC_INPUT_UNWRAP_PRIVATE_KEY_PEM }}
        run: node runner/broker-plan.mjs

  execute:
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner_label }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout trusted executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned mise
        id: mise
        run: node runner/install-mise.mjs
      - name: Execute encrypted repository job
        env:
          BROKER_BRANCH: executor/broker-dev
          BROKER_TRANSPORT_ID: ${{ needs.plan.outputs.transport_id }}
          BROKER_INPUT_PATH: ${{ needs.plan.outputs.input_path }}
          BROKER_ACTIVE_JOBS: ${{ needs.plan.outputs.active_jobs }}
          GITHUB_TOKEN: ${{ github.token }}
          AGENTIC_INPUT_UNWRAP_PRIVATE_KEY_PEM: ${{ secrets.AGENTIC_INPUT_UNWRAP_PRIVATE_KEY_PEM }}
          MISE_BIN: ${{ steps.mise.outputs.mise_bin }}
        run: node runner/execute-v4.mjs
