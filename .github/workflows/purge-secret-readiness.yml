name: Temporary purge secret readiness

on:
  push:
    branches: [purge-retention-ledger]
    paths:
      - ".github/workflows/purge-secret-readiness.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check renamed purge credentials
        env:
          PURGE_ISSUER: ${{ secrets.WORKSPACE_PURGE_APP_ISSUER }}
          PURGE_INSTALLATION: ${{ secrets.WORKSPACE_PURGE_INSTALLATION_ID }}
          PURGE_PRIVATE_KEY: ${{ secrets.WORKSPACE_PURGE_APP_PRIVATE_KEY_PEM }}
          ISSUE_PURGE_TOKEN: ${{ secrets.ISSUE_PURGE_TOKEN }}
        run: |
          node - <<'NODE'
          const names=["PURGE_ISSUER","PURGE_INSTALLATION","PURGE_PRIVATE_KEY","ISSUE_PURGE_TOKEN"];
          let ok=true;
          for(const name of names){
            const present=typeof process.env[name]==="string"&&process.env[name].length>0;
            console.log(name+"="+(present?"present":"missing"));
            if(!present)ok=false;
          }
          if(!ok)process.exitCode=1;
          NODE
