name: Cleanup expired agentic state

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: agentic-retention-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Expire private transient state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENTIC_INPUT_UNWRAP_PRIVATE_KEY_PEM: ${{ secrets.AGENTIC_INPUT_UNWRAP_PRIVATE_KEY_PEM }}
          AGENTIC_CLEANUP_APP_ISSUER: ${{ secrets.AGENTIC_CLEANUP_APP_ISSUER }}
          AGENTIC_CLEANUP_INSTALLATION_ID: ${{ secrets.AGENTIC_CLEANUP_INSTALLATION_ID }}
          AGENTIC_CLEANUP_APP_PRIVATE_KEY_PEM: ${{ secrets.AGENTIC_CLEANUP_APP_PRIVATE_KEY_PEM }}
        run: node runner/cleanup-private-state.mjs
