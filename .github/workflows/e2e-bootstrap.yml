name: Temporary executor E2E bootstrap

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  bootstrap:
    if: ${{ github.event.issue.pull_request == null && github.event.comment.user.login == github.repository_owner && github.event.issue.user.login == github.repository_owner && github.event.comment.body == '/bootstrap-e2e-runners' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Bootstrap private E2E jobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          E2E_CONTROL_ISSUE: ${{ github.event.issue.number }}
          E2E_REPOSITORY_ID: '1375627291'
          E2E_SOURCE_BRANCH: executor-e2e-validation
          E2E_SOURCE_SHA: d9ad0c0a1f6b634c790aec84aedaaee3e1652c9b
          WORKSPACE_CLEANUP_APP_ISSUER: ${{ secrets.WORKSPACE_CLEANUP_APP_ISSUER }}
          WORKSPACE_CLEANUP_INSTALLATION_ID: ${{ secrets.WORKSPACE_CLEANUP_INSTALLATION_ID }}
          WORKSPACE_CLEANUP_APP_PRIVATE_KEY_PEM: ${{ secrets.WORKSPACE_CLEANUP_APP_PRIVATE_KEY_PEM }}
        run: node runner/e2e-bootstrap.mjs
