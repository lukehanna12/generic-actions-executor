name: Temporary purge retention migration

on:
  push:
    branches: [purge-retention-ledger]

permissions:
  contents: write
  issues: read

concurrency:
  group: executor-retention-ledger
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Migrate retained issue state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENTIC_INPUT_UNWRAP_PRIVATE_KEY_PEM: ${{ secrets.AGENTIC_INPUT_UNWRAP_PRIVATE_KEY_PEM }}
        run: node runner/migrate-retention-to-purge.mjs
