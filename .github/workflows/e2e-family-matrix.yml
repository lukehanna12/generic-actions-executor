name: Temporary executor E2E family matrix

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  prepare:
    if: ${{ github.event.issue.pull_request == null && github.event.comment.user.login == github.repository_owner && github.event.issue.user.login == github.repository_owner && github.event.comment.body == '/run-e2e-family-matrix' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - name: Read bootstrapped triggers
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${CONTROL_ISSUE}/comments?per_page=100")"
          body="$(jq -r '[.[] | select(.body | startswith("E2E_TRIGGERS_V1\n"))] | last | .body' <<<"$comments")"
          test "$body" != "null"
          payload="$(printf '%s\n' "$body" | sed -n '3p')"
          matrix="$(jq -c '[.[] | {runner:.runner_label, job_id:.job_id, request_b64:(@base64)}]' <<<"$payload")"
          test "$(jq 'length' <<<"$matrix")" -eq 5
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  execute:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout trusted executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Load and validate opaque trigger
        env:
          REQUEST_B64: ${{ matrix.request_b64 }}
          EXPECTED_RUNNER: ${{ matrix.runner }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { parseTriggerRequest } from "./runner/trigger-request.mjs";
          const raw=Buffer.from(process.env.REQUEST_B64,"base64").toString("utf8");
          const value=JSON.parse(raw);
          const parsed=parseTriggerRequest(raw,value.job_id);
          if(parsed.runner_label!==process.env.EXPECTED_RUNNER)throw new Error("matrix runner mismatch");
          fs.appendFileSync(process.env.GITHUB_ENV,"REQUEST_TITLE="+value.job_id+"\nREQUEST_JSON<<__E2E__\n"+raw+"\n__E2E__\n");
          NODE
      - name: Validate production trigger planner
        run: node runner/trigger-plan.mjs
      - name: Install pinned mise
        id: mise
        run: node runner/install-mise.mjs
      - name: Execute encrypted private candidate
        id: execute
        env:
          AGENTIC_INPUT_UNWRAP_PRIVATE_KEY_PEM: ${{ secrets.AGENTIC_INPUT_UNWRAP_PRIVATE_KEY_PEM }}
          AGENTIC_FETCH_APP_ISSUER: ${{ secrets.AGENTIC_FETCH_APP_ISSUER }}
          AGENTIC_FETCH_INSTALLATION_ID: ${{ secrets.AGENTIC_FETCH_INSTALLATION_ID }}
          AGENTIC_FETCH_APP_PRIVATE_KEY_PEM: ${{ secrets.AGENTIC_FETCH_APP_PRIVATE_KEY_PEM }}
          MISE_BIN: ${{ steps.mise.outputs.mise_bin }}
        run: node runner/execute-v3.mjs
      - name: Seal result after candidate termination
        id: finalize
        if: ${{ steps.execute.outcome == 'success' }}
        env:
          AGENTIC_RESULT_UNWRAP_PRIVATE_KEY_PEM: ${{ secrets.AGENTIC_RESULT_UNWRAP_PRIVATE_KEY_PEM }}
        run: node runner/finalize-v3.mjs
      - name: Upload encrypted result capsule
        if: ${{ steps.finalize.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: capsule-${{ matrix.runner }}
          path: capsule.bin
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false
