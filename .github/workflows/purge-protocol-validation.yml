name: Purge protocol validation

on:
  push:
    branches: [purge-retention-ledger]
    paths:
      - ".github/workflows/purge-protocol-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Syntax-check modules
        shell: bash
        run: |
          set -euo pipefail
          for file in runner/*.mjs; do node --check "$file"; done
      - name: Run protocol tests
        run: |
          node runner/test-runner-registry.mjs
          node runner/test-purge-protocol.mjs
          node --test runner/test-macos-launch.mjs
      - name: Enforce purge-only vocabulary
        shell: bash
        run: |
          set -euo pipefail
          legacy="cle""anup"
          if grep -Rni --exclude-dir=.git "$legacy" .; then
            echo "legacy terminology remains in file content"
            exit 1
          fi
          if find . -path ./.git -prune -o -iname "*${legacy}*" -print | grep -q .; then
            echo "legacy terminology remains in a path"
            exit 1
          fi
